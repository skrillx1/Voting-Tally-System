<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Tally View</title>
    <style>
      :root {
        --bg-slate-50: #f8fafc;
        --bg-slate-100: #f1f5f9;
        --bg-slate-200: #e2e8f0;
        --text-slate-400: #94a3b8;
        --text-slate-500: #64748b;
        --text-slate-600: #475569;
        --text-slate-700: #334155;
        --text-slate-800: #1e293b;
        --border-slate-200: #e2e8f0;
        --primary-indigo: #4f46e5;
        --indigo-50: #eef2ff;
        --indigo-100: #e0e7ff;
        --indigo-600: #4f46e5;
        --indigo-700: #4338ca;
        --emerald-50: #ecfdf5;
        --emerald-600: #059669;
        --blue-50: #eff6ff;
        --blue-600: #2563eb;
        --amber-50: #fffbeb;
        --amber-600: #d97706;
        --amber-800: #92400e;
        --amber-100: #fef3c7;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-slate-50);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          sans-serif;
        color: var(--text-slate-800);
        padding: 1.5rem;
        line-height: 1.5;
      }

      @media (min-width: 768px) {
        body {
          padding: 3rem;
        }
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
      }

      /* Flex and Grid Utilities */
      .d-flex {
        display: flex;
      }
      .flex-column {
        flex-direction: column;
      }
      .justify-between {
        justify-content: space-between;
      }
      .align-center {
        align-items: center;
      }
      .gap-1 {
        gap: 0.25rem;
      }
      .gap-2 {
        gap: 0.5rem;
      }
      .gap-3 {
        gap: 0.75rem;
      }
      .gap-4 {
        gap: 1rem;
      }

      @media (min-width: 768px) {
        .flex-md-row {
          flex-direction: row;
        }
        .align-md-center {
          align-items: center;
        }
      }

      .grid-kpi {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      @media (min-width: 768px) {
        .grid-kpi {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      /* Header styling */
      header {
        padding-bottom: 1rem;
        margin-bottom: 1.5rem;
        border-bottom: 1px solid var(--border-slate-200);
      }

      .h3-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-slate-800);
        letter-spacing: -0.025em;
      }

      /* Card layout */
      .dashboard-card {
        background: #ffffff;
        border: 1px solid var(--border-slate-200);
        border-radius: 0.85rem;
        box-shadow:
          0 1px 3px rgba(15, 23, 42, 0.03),
          0 10px 15px -3px rgba(15, 23, 42, 0.02);
        transition: box-shadow 0.2s ease;
      }

      .dashboard-card:hover {
        box-shadow:
          0 4px 6px -1px rgba(15, 23, 42, 0.05),
          0 12px 20px -4px rgba(15, 23, 42, 0.03);
      }

      .card-p3 {
        padding: 1rem;
      }

      /* Buttons & Badges */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        padding: 0.375rem 0.75rem;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--border-slate-200);
        background: #ffffff;
        color: var(--text-slate-600);
        transition: all 0.15s ease;
      }

      .btn:hover {
        background-color: var(--bg-slate-100);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        border-radius: 9999px;
        padding: 0.25rem 0.625rem;
        font-size: 0.75rem;
        font-weight: 500;
      }

      .badge-live {
        background: #ffffff;
        color: var(--text-slate-700);
        border: 1px solid var(--border-slate-200);
      }

      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #10b981;
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
        animation: pulseGreen 2s infinite;
        margin-right: 0.375rem;
      }

      @keyframes pulseGreen {
        0% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
        }
        70% {
          transform: scale(1);
          box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
        }
        100% {
          transform: scale(0.95);
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
        }
      }

      /* KPI Box Styles */
      .kpi-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-slate-500);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .kpi-icon {
        width: 2rem;
        height: 2rem;
        border-radius: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .kpi-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-slate-800);
        margin-top: 0.5rem;
      }

      /* Search & Input */
      .input-group {
        display: flex;
        align-items: center;
        border: 1px solid var(--border-slate-200);
        border-radius: 0.375rem;
        overflow: hidden;
        background: #ffffff;
      }

      .input-group-text {
        padding: 0.375rem 0.5rem;
        background: var(--bg-slate-50);
        color: var(--text-slate-400);
        display: flex;
        align-items: center;
      }

      .form-control {
        border: none;
        outline: none;
        padding: 0.375rem 0.5rem;
        font-size: 0.875rem;
        width: 100%;
        color: var(--text-slate-800);
      }

      /* Table Styles */
      .table-responsive {
        width: 100%;
        overflow-x: auto;
        max-height: 65vh;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        font-size: 0.875rem;
      }

      .sticky-header th {
        position: sticky;
        top: 0;
        background: var(--bg-slate-50);
        z-index: 5;
        border-bottom: 2px solid var(--border-slate-200);
        padding: 0.75rem 0.5rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-slate-500);
        font-weight: 600;
      }

      tbody tr {
        border-bottom: 1px solid var(--bg-slate-100);
        transition: background-color 0.15s ease;
      }

      tbody tr:hover {
        background-color: rgba(248, 250, 252, 0.8);
      }

      td {
        padding: 0.75rem 0.5rem;
        color: var(--text-slate-700);
      }

      /* Editable cell interaction */
      td[contenteditable="true"] {
        border-radius: 6px;
        transition: all 0.15s ease-in-out;
      }

      td[contenteditable="true"]:hover {
        background-color: var(--bg-slate-100);
        cursor: pointer;
      }

      td[contenteditable="true"]:focus {
        outline: none;
        background-color: #ffffff;
        box-shadow: 0 0 0 2px var(--primary-indigo);
      }

      /* Trophy & Leader highlight */
      .leader-badge {
        background: linear-gradient(135deg, var(--amber-100) 0%, #fde68a 100%);
        color: var(--amber-800);
        border: 1px solid #fcd34d;
        padding: 0.125rem 0.375rem;
        border-radius: 9999px;
        margin-left: 0.25rem;
        display: inline-flex;
        align-items: center;
      }

      @keyframes countPulse {
        0% {
          background-color: rgba(16, 185, 129, 0.25);
          transform: scale(1.02);
        }
        100% {
          background-color: transparent;
          transform: scale(1);
        }
      }

      .tally-updated {
        animation: countPulse 1.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      kbd {
        background: #ffffff;
        border: 1px solid var(--border-slate-200);
        border-radius: 0.2rem;
        padding: 0.1rem 0.3rem;
        font-family: monospace;
        font-size: 0.75rem;
      }

      .overflow-hidden {
        overflow: hidden;
      }
      .text-center {
        text-align: center;
      }
      .text-xs {
        font-size: 0.75rem;
      }
      .fw-semibold {
        font-weight: 600;
      }
      .fw-bold {
        font-weight: 700;
      }
      .text-slate-500 {
        color: var(--text-slate-500);
      }
      .text-slate-800 {
        color: var(--text-slate-800);
      }
      .icon-svg {
        width: 1rem;
        height: 1rem;
        fill: currentColor;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header
        class="d-flex flex-column flex-md-row justify-between align-md-center gap-3"
      >
        <div>
          <div class="d-flex align-center gap-2">
            <!-- Inline Chart Icon -->
            <svg
              class="icon-svg"
              style="width: 1.5rem; height: 1.5rem; color: var(--indigo-600)"
              viewBox="0 0 24 24"
            >
              <path d="M3.5 18.5l6-6 4 4 7-7M20.5 9.5v-6h-6" />
            </svg>
            <h1 class="h3-title">Live Tally Dashboard</h1>
          </div>
          <p class="text-slate-500 text-xs" style="margin-top: 0.25rem">
            Real-time election tracking & candidate tally updates
          </p>
        </div>

        <div class="d-flex align-center gap-2">
          <span class="badge badge-live">
            <span class="pulse-dot"></span>
            <span>Live Sync Active</span>
          </span>
          <button onclick="renderData()" class="btn">
            <!-- Inline Refresh Icon -->
            <svg
              class="icon-svg"
              style="margin-right: 0.25rem"
              viewBox="0 0 24 24"
            >
              <path
                d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"
              />
            </svg>
            Refresh
          </button>
        </div>
      </header>

      <!-- KPI Dashboard Row -->
      <div class="grid-kpi">
        <!-- Candidates KPI -->
        <div class="dashboard-card card-p3">
          <div class="d-flex align-center justify-between">
            <span class="kpi-title">Candidates</span>
            <div
              class="kpi-icon"
              style="background: var(--indigo-50); color: var(--indigo-600)"
            >
              <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
            </div>
          </div>
          <div class="kpi-value" id="kpiCandidates">0</div>
        </div>

        <!-- Positions KPI -->
        <div class="dashboard-card card-p3">
          <div class="d-flex align-center justify-between">
            <span class="kpi-title">Positions</span>
            <div
              class="kpi-icon"
              style="background: var(--blue-50); color: var(--blue-600)"
            >
              <svg class="icon-svg" viewBox="0 0 24 24">
                <path
                  d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
                />
              </svg>
            </div>
          </div>
          <div class="kpi-value" id="kpiPositions">0</div>
        </div>

        <!-- Total Ballots KPI -->
        <div class="dashboard-card card-p3">
          <div class="d-flex align-center justify-between">
            <span class="kpi-title">Total Ballots</span>
            <div
              class="kpi-icon"
              style="background: var(--emerald-50); color: var(--emerald-600)"
            >
              <svg class="icon-svg" viewBox="0 0 24 24">
                <path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4" />
              </svg>
            </div>
          </div>
          <div class="kpi-value" id="kpiTotalBallots">0</div>
        </div>

        <!-- Leaders KPI -->
        <div class="dashboard-card card-p3">
          <div class="d-flex align-center justify-between">
            <span class="kpi-title">Leaders</span>
            <div
              class="kpi-icon"
              style="background: var(--amber-50); color: var(--amber-600)"
            >
              <svg class="icon-svg" viewBox="0 0 24 24">
                <path
                  d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17M14 14.66V17M18 2H6v7a6 6 0 0 0 12 0V2z"
                />
              </svg>
            </div>
          </div>
          <div class="kpi-value" id="kpiActiveLeaders">0</div>
        </div>
      </div>

      <!-- Main Dashboard Card -->
      <div class="dashboard-card overflow-hidden">
        <div
          class="card-p3 d-flex flex-column flex-md-row justify-between align-md-center gap-3"
          style="border-bottom: 1px solid var(--border-slate-200)"
        >
          <div>
            <h2 style="font-size: 1rem; font-weight: 700">
              Tally Results Overview
            </h2>
            <p class="text-slate-500 text-xs" style="margin-top: 0.2rem">
              Click on candidate name or tally count cells to edit values
              directly.
            </p>
          </div>

          <div style="min-width: 260px">
            <div class="input-group">
              <span class="input-group-text">
                <svg class="icon-svg" viewBox="0 0 24 24">
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
              </span>
              <input
                type="text"
                id="searchInput"
                oninput="filterCandidates()"
                class="form-control"
                placeholder="Search candidate name or ID..."
              />
            </div>
          </div>
        </div>

        <!-- Tally Results Table -->
        <div class="table-responsive">
          <table class="sticky-header" id="tallyTable">
            <thead id="tallyHead">
              <!-- Headers dynamically generated -->
            </thead>
            <tbody id="resultsBody">
              <!-- Dynamic rows generated via JS -->
            </tbody>
          </table>
        </div>

        <!-- Table Footer -->
        <div
          class="card-p3 text-xs text-slate-500 d-flex justify-between align-center"
          style="
            background: var(--bg-slate-50);
            border-top: 1px solid var(--border-slate-200);
          "
        >
          <span
            >Showing
            <strong id="visibleCount" class="text-slate-800">0</strong>
            candidates</span
          >
          <span>Press <kbd>Enter</kbd> to save edit</span>
        </div>
      </div>
    </div>

    <script>
      const defaultPositions = [
        "Vice 1",
        "Vice 2",
        "Treasurer",
        "Auditor",
        "Information",
        "Civic",
        "Social",
        "Membership",
        "Property Custodian",
      ];

      let previousTallies = {};

      function getPositions() {
        const stored = localStorage.getItem("positions");
        if (stored) {
          try {
            const parsed = JSON.parse(stored);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          } catch (e) {
            console.error("Failed to parse stored positions:", e);
          }
        }
        return defaultPositions;
      }

      function renderTableHeader(positions) {
        const thead = document.getElementById("tallyHead");
        thead.innerHTML = "";

        const tr = document.createElement("tr");

        const thCandidate = document.createElement("th");
        thCandidate.style.minWidth = "220px";
        thCandidate.innerText = "Candidate";
        tr.appendChild(thCandidate);

        positions.forEach((pos, idx) => {
          const th = document.createElement("th");
          th.className = "text-center";
          th.style.minWidth = "110px";
          th.innerHTML = `
            <div class="d-flex flex-column align-center">
              <span class="badge" style="background: var(--bg-slate-200); color: var(--text-slate-600); width:18px; height:18px; justify-content:center; padding:0; margin-bottom:0.25rem;">${idx + 1}</span>
              <span>${escapeHTML(pos)}</span>
            </div>
          `;
          tr.appendChild(th);
        });

        thead.appendChild(tr);
      }

      function renderData() {
        const positions = getPositions();
        renderTableHeader(positions);

        const candidates = JSON.parse(localStorage.getItem("candidates")) || {};
        const tallies = JSON.parse(localStorage.getItem("tallies")) || {};
        const resultsBody = document.getElementById("resultsBody");
        const searchTerm = (document.getElementById("searchInput")?.value || "")
          .toLowerCase()
          .trim();

        const maxPerPosition = {};
        const totalVotesPerPosition = {};

        positions.forEach((pos) => {
          let maxVotes = 0;
          let posVotes = 0;
          Object.keys(candidates).forEach((id) => {
            const votes = tallies[id]?.[pos] || 0;
            posVotes += votes;
            if (votes > maxVotes) maxVotes = votes;
          });
          maxPerPosition[pos] = maxVotes;
          totalVotesPerPosition[pos] = posVotes;
        });

        const recordedBallots = parseInt(
          localStorage.getItem("ballotCount"),
          10,
        );
        const derivedMaxBallots = Math.max(
          0,
          ...Object.values(totalVotesPerPosition),
        );
        const totalBallots =
          !isNaN(recordedBallots) && recordedBallots >= derivedMaxBallots
            ? recordedBallots
            : derivedMaxBallots;

        resultsBody.innerHTML = "";

        let visibleCandidateCount = 0;
        let activeLeadersSet = new Set();
        const candidateEntries = Object.entries(candidates);

        if (candidateEntries.length === 0) {
          resultsBody.innerHTML = `
            <tr>
              <td colspan="${positions.length + 1}" class="text-center text-slate-500" style="padding: 2.5rem 0;">
                No candidates found. Add candidates in the Vote Tally Manager.
              </td>
            </tr>
          `;
          updateKPIs(0, positions.length, totalBallots, 0);
          document.getElementById("visibleCount").innerText = 0;
          return;
        }

        candidateEntries.forEach(([id, name]) => {
          const fullCandidateStr = `${id} - ${name}`;

          if (
            searchTerm &&
            !fullCandidateStr.toLowerCase().includes(searchTerm)
          ) {
            return;
          }

          visibleCandidateCount++;
          const tr = document.createElement("tr");

          let positionCellsHtml = positions
            .map((pos) => {
              const votes = tallies[id]?.[pos] || 0;
              const isLeader = votes === maxPerPosition[pos] && votes > 0;
              if (isLeader) activeLeadersSet.add(pos);

              const oldVotes = previousTallies[id]?.[pos] || 0;
              const increased = votes > oldVotes;

              return `
              <td contenteditable="true" data-id="${id}" data-pos="${pos}" class="text-center ${increased ? "tally-updated" : ""}">
                <div class="d-flex align-center justify-between" style="justify-content: center;">
                  <span class="fw-semibold" style="color: ${isLeader ? "var(--amber-800)" : "var(--text-slate-800)"}">${votes}</span>
                  ${isLeader ? `<span class="leader-badge" title="Position Leader"><svg class="icon-svg" style="width:0.75rem; height:0.75rem;" viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17M14 14.66V17M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg></span>` : ""}
                </div>
              </td>
            `;
            })
            .join("");

          tr.innerHTML = `
            <td contenteditable="true" data-id="${id}" data-pos="name">
              <div class="d-flex align-center gap-2">
                <span class="badge" style="background: var(--indigo-50); color: var(--indigo-700); border: 1px solid var(--indigo-100);">ID: ${id}</span>
                <span class="fw-semibold">${escapeHTML(name)}</span>
              </div>
            </td>
            ${positionCellsHtml}
          `;

          resultsBody.appendChild(tr);
        });

        previousTallies = JSON.parse(JSON.stringify(tallies));
        updateKPIs(
          candidateEntries.length,
          positions.length,
          totalBallots,
          activeLeadersSet.size,
        );
        document.getElementById("visibleCount").innerText =
          visibleCandidateCount;
      }

      function updateKPIs(
        candidatesCount,
        positionsCount,
        totalBallots,
        leaderCount,
      ) {
        document.getElementById("kpiCandidates").innerText = candidatesCount;
        document.getElementById("kpiPositions").innerText = positionsCount;
        document.getElementById("kpiTotalBallots").innerText =
          totalBallots.toLocaleString();
        document.getElementById("kpiActiveLeaders").innerText = leaderCount;
      }

      function saveCell(e) {
        if (!e.target.matches("td[contenteditable='true']")) return;

        const id = e.target.dataset.id;
        const pos = e.target.dataset.pos;
        if (!id || !pos) return;

        const candidates = JSON.parse(localStorage.getItem("candidates")) || {};
        const tallies = JSON.parse(localStorage.getItem("tallies")) || {};

        let rawValue = e.target.innerText.trim();

        if (pos === "name") {
          const parts = rawValue.split("-");
          const cleanName =
            parts.length > 1
              ? parts.slice(1).join("-").trim()
              : rawValue.trim();
          if (cleanName) {
            candidates[id] = cleanName;
            localStorage.setItem("candidates", JSON.stringify(candidates));
          }
        } else {
          const digitsOnly = rawValue.replace(/\D/g, "");
          const newVotes = parseInt(digitsOnly, 10) || 0;

          if (!tallies[id]) tallies[id] = {};
          tallies[id][pos] = newVotes;
          localStorage.setItem("tallies", JSON.stringify(tallies));
        }

        renderData();
      }

      function filterCandidates() {
        renderData();
      }

      function escapeHTML(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      document.addEventListener("blur", saveCell, true);

      document.addEventListener("keydown", function (e) {
        if (
          e.target.matches("td[contenteditable='true']") &&
          e.key === "Enter"
        ) {
          e.preventDefault();
          e.target.blur();
        }
      });

      window.addEventListener("storage", function (event) {
        if (
          ["candidates", "tallies", "positions", "ballotCount"].includes(
            event.key,
          )
        ) {
          renderData();
        }
      });

      window.onload = function () {
        renderData();
      };
    </script>
  </body>
</html>
